; PHP-FPM pool for the app tier — sized for a c6i.xlarge (4 vCPU / 8GB).
; Installed at /etc/php/8.4/fpm/pool.d/www-app.conf by
; infra/terraform/user_data/app.sh.tpl, replacing the stock www.conf pool
; (which defaults to pm.max_children=5 — nowhere near enough concurrency
; for this app's target load; see the stress-testing guide under
; deploy/loadtest/README.md for how this number was arrived at).
[app]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-app.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
; ~40-50MB per worker once Laravel's bootstrapped (opcache warm) — on an
; 8GB box, leaving headroom for Nginx/OS/CloudWatch agent, this keeps
; total PHP-FPM memory comfortably under half the box. Re-check this
; against real memory-per-worker (ps_mem or similar) once traffic is
; flowing; it's a starting point, not a measured number.
pm.max_children = 150
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 40
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
; Stock php.ini defaults to upload_max_filesize=2M/post_max_size=8M, well
; under nginx's own client_max_body_size 10m (deploy/nginx/app.conf) — an
; upload between 2M and the app's own validated max (background image,
; up to 4M) would otherwise be silently dropped by PHP before Laravel's
; validation ever runs. post_max_size stays a little above
; upload_max_filesize to leave room for the rest of a multipart request.
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
